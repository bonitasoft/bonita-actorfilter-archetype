name: Build

on:
  push:
    branches:
      - master
      - support/*
  pull_request:
    branches:
      - master
      - support/*

jobs:

  build:
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{steps.get-app-version.outputs.APP_VERSION}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      # TODO Bonita 12.0 GA: remove this step once Bonita 12.0 is released on Maven Central (only needed to resolve runtime snapshots)
      - name: Setup Maven settings
        uses: bonitasoft/maven-settings-action@v2
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}

      - name: Get archetype version
        id: get-app-version
        run: |
          extracted_version=$(./mvnw -q -DforceStdout --non-recursive help:evaluate -Dexpression=project.version)
          echo "APP_VERSION=$extracted_version" >> $GITHUB_OUTPUT

      - name: Build and test archetype
        run: ./mvnw -B -ntp install

      - name: Run Integration tests for java archetype sub-modules
        run: ./mvnw -B -ntp groovy:execute -Dsource=target/test-classes/testJavaSubModuleProject/IT.groovy -Dscope=test

      - name: Run Integration tests for groovy archetype sub-modules
        run: ./mvnw -B -ntp groovy:execute -Dsource=target/test-classes/testGroovySubModuleProject/IT.groovy -Dscope=test

      - name: Run Integration tests for kotlin archetype sub-modules
        run: ./mvnw -B -ntp groovy:execute -Dsource=target/test-classes/testKotlinSubModuleProject/IT.groovy -Dscope=test

      - name: Run Integration test for unsupported Bonita version rejection
        run: ./mvnw -B -ntp groovy:execute -Dsource=target/test-classes/testInvalidBonitaVersion/IT.groovy -Dscope=test

      - name: Upload archetype for tests
        uses: actions/upload-artifact@v7
        with:
          name: latest-snapshot
          path: target/bonita-actorfilter-archetype-*
          overwrite: true
          retention-days: 1

      - name: Upload archetype pom for tests
        uses: actions/upload-artifact@v7
        with:
          name: latest-snapshot-pom
          path: pom.xml
          overwrite: true
          retention-days: 1

  test:
    needs: build
    strategy:
      matrix:
        platform: [ ubuntu-24.04, macos-15, windows-2025 ]
        language: [ java, kotlin, groovy ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Download latest archetype snapshot
        uses: actions/download-artifact@v8
        with:
          name: latest-snapshot

      - name: Download archetype pom
        uses: actions/download-artifact@v8
        with:
          name: latest-snapshot-pom

      - name: Display structure of downloaded files
        run: ls -R

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      # TODO Bonita 12.0 GA: remove this step once Bonita 12.0 is released on Maven Central (only needed to resolve runtime snapshots)
      - name: Setup Maven settings
        uses: bonitasoft/maven-settings-action@v2
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}

      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ matrix.language }}-m2-${{needs.build.outputs.app_version}}
          restore-keys: ${{ runner.os }}-${{ matrix.language }}-m2-

      - name: Install latest archetype in local repo
        shell: bash
        run: |
          mvn -B -ntp install:install-file -Dfile=bonita-actorfilter-archetype-${{needs.build.outputs.app_version}}.jar -DpomFile=pom.xml
          rm pom.xml

      # TODO Bonita 12.0 GA: switch -DbonitaVersion to 12.0.0
      - name: Generate project and build it
        shell: bash
        run: >-
          mvn -B -ntp archetype:generate
          -DarchetypeGroupId=org.bonitasoft.archetypes
          -DarchetypeArtifactId=bonita-actorfilter-archetype
          -DarchetypeVersion=${{needs.build.outputs.app_version}}
          -DgroupId=org.bonita.test.actorfilter
          -DartifactId=test-actorfilter-${{ matrix.language }}
          -Dversion=1.0.0-SNAPSHOT
          -Dpackage=org.bonita.test.actorfilter
          -DbonitaVersion=12.0-SNAPSHOT
          -DclassName=MyTestActorFilter
          -Dlanguage=${{ matrix.language }}

      - name: Build and test generated ${{ matrix.language }} project
        shell: bash
        run: mvn -B -ntp verify -f test-actorfilter-${{ matrix.language }}/pom.xml
